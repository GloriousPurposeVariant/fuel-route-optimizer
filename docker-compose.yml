name: fuel-route-optimizer

services:
  web:
    build: .
    image: fuel-route-optimizer:latest
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/var/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/var
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
